version: '3.8'

# Production compose — used on the Oracle Cloud VM.
# Key differences from docker-compose.yml:
#   - Frontend removed (deployed separately on Vercel)
#   - PostgreSQL and Meilisearch ports NOT exposed to the internet
#   - Backend SSL disabled; Caddy handles TLS termination instead
#   - Backend bound to 127.0.0.1 so only Caddy on the same host can reach it

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: allinone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allinone_shop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # No ports block — database is reachable only inside Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./postgres/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Meilisearch ─────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: allinone-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_ENV: production
    # No ports block — search engine reachable only inside Docker network
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (Spring Boot) ───────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: allinone-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-allinone_shop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      # Disable Spring Boot's built-in SSL — Caddy handles TLS on the host
      SERVER_SSL_ENABLED: "false"
      SERVER_PORT: "8080"
    ports:
      # Bind to loopback only: Caddy reaches it, the public internet cannot
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/products?size=1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Activity Monitor (Node.js) ──────────────────────────────
  activity-monitor:
    build:
      context: ../activity-monitor
      dockerfile: Dockerfile
    container_name: allinone-activity-monitor
    restart: unless-stopped
    ports:
      # Loopback only — not exposed to internet
      - "127.0.0.1:4000:4000"

  # ── Scraper (Python) ────────────────────────────────────────
  scraper:
    build:
      context: ../scraper
      dockerfile: Dockerfile
    container_name: allinone-scraper
    restart: unless-stopped
    environment:
      SCRAPER_API_URL: ${SCRAPER_API_URL:-http://backend:8080/api}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-changeme-scraper-key}
      SCRAPER_TRIGGER_PORT: "9090"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  meili_data:
