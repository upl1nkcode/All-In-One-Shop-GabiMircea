spring:
  application:
    name: allinone-shop-api-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-testing
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173
