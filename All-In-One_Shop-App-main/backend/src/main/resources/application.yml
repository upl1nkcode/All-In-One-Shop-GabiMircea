spring:
  application:
    name: allinone-shop-api

server:
  port: ${SERVER_PORT:8443}
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: allinoneshop
    enabled: true
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-enough-for-security}
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:https://localhost:5173,https://localhost:3000,https://localhost:3001,http://localhost:5173,http://localhost:3000,http://localhost:3001}

# Logging
logging:
  level:
    root: INFO
    com.allinoneshop: DEBUG

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
